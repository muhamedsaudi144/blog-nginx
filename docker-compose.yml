version: '3.9'

services:

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64  
    networks:
      - sarwa_nginx
    ports:
      - '8080:8080'
    environment:
      # APP_HOST_NAME: mainapp
      # APP_PORT: 8000
      SARWA_HOST: www.stage.sarwa.co

networks:
  sarwa_nginx:
    name: sarwa_nginx
