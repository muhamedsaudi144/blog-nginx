server {
    listen 8080;
    server_name wp-blog.sarwa.co;

    #=====================================================================
    # STATIC FILES & WELL-KNOWN ENDPOINTS
    # These are served directly by Nginx for app integrations and compliance.
    #================================w=====================================

    location = /apple-app-site-association { root '/usr/share/nginx/html/.well-known'; default_type 'application/json'; }
    location = /.well-known/apple-app-site-association { root '/usr/share/nginx/html'; default_type 'application/json'; }
    location = /.well-known/apple-developer-merchantid-domain-association { root '/usr/share/nginx/html'; default_type 'text/plain'; }
    location = /.well-known/assetlinks.json { root '/usr/share/nginx/html'; default_type 'application/json'; }
    location = /.well-known/jwk.json { root '/usr/share/nginx/html'; default_type 'application/json'; }
    location = /robots.txt { root '/usr/share/nginx/html'; default_type 'text/plain'; }
    location = /app-ads.txt { root '/usr/share/nginx/html'; default_type 'text/plain'; }
    location = /ads.txt { root '/usr/share/nginx/html'; default_type 'text/plain'; }
    location = /healthy { root '/usr/share/nginx/html'; default_type 'text/plain'; }

    #=====================================================================
    # STATIC BLOG REVERSE PROXY
    # Proxies requests from www.sarwa.co/blog/ to the static site at
    # blog.sarwa.co, rewriting URLs to maintain the main domain for SEO.
    #=====================================================================

    # Block search engine crawling for the blog's original robots.txt to avoid conflicts.
    location = /blog/robots.txt {
        return 404;
    }

    # Handle duplicate path that shows up in search results.
    # Must be defined before the ^~ /blog/ proxy rule below.
    location = /blog/blog {
        rewrite ^ /blog/ last;
    }
    location = /blog/blog/ {
        rewrite ^ /blog/ last;
    }

    # Main proxy rule for all requests under /blog/
    location ^~ /blog/ {
        # The static site hosted at Simply Static Studio.
        # The trailing slash is important here.
        proxy_pass https://blog.sarwa.co/;

        # --- Critical for URL Substitution ---
        # 1. Disable compression from the proxy to allow Nginx to modify the response body.
        # If the response is gzipped, subs_filter cannot find and replace the text.
        proxy_set_header Accept-Encoding "";

        # 2. Disable Nginx's own gzip for this location block.
        gzip off;
        # --- End Critical Section ---

        # Rewrite all hardcoded "blog.sarwa.co" URLs in the HTML/CSS/JS response
        # to "www.sarwa.co/blog" to keep users on the main domain.
        # The order is from most to least specific.
        subs_filter_types text/html text/css text/xml text/javascript application/javascript;
        subs_filter 'https://blog.sarwa.co/' 'https://www.sarwa.co/blog/' gi;
        subs_filter 'http://blog.sarwa.co/' 'https://www.sarwa.co/blog/' gi;
        subs_filter 'blog.sarwa.co/' 'www.sarwa.co/blog/' gi;
        subs_filter 'blog.sarwa.co' 'www.sarwa.co/blog' gi; # Catch-all

        # Set headers to inform the upstream server about the original request.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host "www.sarwa.co";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host "blog.sarwa.co";

        # Set longer timeouts for potentially slow backend responses.
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Prevent cookies from the blog from being sent to the client.
        proxy_hide_header Set-Cookie;
        proxy_set_header Cookie "";

        # Handle any stray redirects from the static host and rewrite them correctly.
        proxy_redirect https://blog.sarwa.co/ /blog/;
    }

    #=====================================================================
    # SECURITY & HTTP METHOD RESTRICTIONS
    #=====================================================================

    # Only allow a safe list of HTTP methods.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH)$) {
        return 405;
    }

    # Standard security headers.
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
} 