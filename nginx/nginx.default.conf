server {
    listen 8080;
    server_name wp-blog.sarwa.co;

    ######################################################################
    # STATIC FILES
    ######################################################################

    # location = /favicon.ico { access_log off; log_not_found off; }  

    location = /apple-app-site-association {
        root '/usr/share/nginx/html/.well-known';
        default_type 'application/json';
    }

    location = /.well-known/apple-app-site-association {
        root '/usr/share/nginx/html';
        default_type 'application/json';
    }

    location = /.well-known/apple-developer-merchantid-domain-association {
        root '/usr/share/nginx/html';
        default_type 'text/plain';
    }
    
    location = /.well-known/assetlinks.json {
        root '/usr/share/nginx/html';
        default_type 'application/json';
    }

    location = /.well-known/jwk.json {
        root '/usr/share/nginx/html';
        default_type 'application/json';
    }    

    location = /robots.txt {
        root '/usr/share/nginx/html';
        default_type 'text/plain';
    }

    location = /app-ads.txt {
        root '/usr/share/nginx/html';
        default_type 'text/plain';
    }

    location = /ads.txt {
        root '/usr/share/nginx/html';
        default_type 'text/plain';
    }

    location = /healthy {
        root '/usr/share/nginx/html';
        default_type 'text/plain';
    }

    ######################################################################

    location /blog/robots.txt {
        return 404; # add high-precedence location to avoid proxying WPEngine's robot.txt file
    }

   # Consolidate the two location blocks for /blog
    location ^~ /blog/ {
        proxy_pass https://blogv2.sarwa.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding ""; # allows subs_filter to parse response
        proxy_ignore_headers Cache-Control;
        proxy_connect_timeout 100s;
        proxy_send_timeout 100s;
        proxy_read_timeout 100s;
        fastcgi_read_timeout 100s;
        proxy_set_header Cookie ""; # prevent forwarding of cookies
        proxy_hide_header Set-Cookie; # prevent passing of WP cookie back to client
        # proxy_http_version 1.1;
        # proxy_set_header Connection "";

        proxy_redirect http://$proxy_host/ /blog/;

        # strip /blog/ from the path
        rewrite ^/blog/(.*)$ /$1 break;
        
        # replace all instances of the WPEngine subdomain from the response
        subs_filter_types text/html text/css text/xml;
        subs_filter 'blogv2.sarwa.co' 'www.sarwa.co/blog' gi;

        # access_log /var/log/nginx/wp-blog.access.log;
        # error_log /var/log/nginx/wp-blog.error.log;
    }  

    # location = /blog {
