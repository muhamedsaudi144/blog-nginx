    #     # access_log /var/log/nginx/sarwa.blog.access.log;
    #     # error_log /var/log/nginx/sarwa.blog.error.log;
    # }
  
    # allow Only GET, HEAD, POST and DELETE in HTTP Requests
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH)$ )
    {
        return 405;
    }

    # X-XSS Protection
    # This header enables the Cross-site scripting (XSS) filter built into most recent web browsers.
    # It's usually enabled by default anyway, so the role of this header is to re-enable the filter (filters out input that looks like a JS script)
    add_header X-XSS-Protection "1; mode=block";

    # when serving user-supplied content, include a X-Content-Type-Options: nosniff header along with the Content-Type: header,
    # to disable content-type sniffing on some browsers (IE).
    # see https://en.wikipedia.org/wiki/Content_sniffing for more on why it's a security risk to allow content sniffing
    add_header X-Content-Type-Options nosniff;

    #To prevent clickjacking Attack by disallowing iframes
    # if you need to allow [i]frames, you can use SAMEORIGIN or even set an uri with ALLOW-FROM uri
    add_header X-Frame-Options SAMEORIGIN;
}
